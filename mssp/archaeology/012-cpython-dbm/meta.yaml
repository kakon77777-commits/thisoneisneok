id: 012-cpython-dbm
project: CPython dbm
upstream: https://github.com/python/cpython/tree/main/Lib/dbm
license: PSF-2.0
examined_version: 3.14.5
title:
  zh: 兩種都叫做「支援併發」的保證
  en: "Two guarantees that both get called concurrency"
summary:
  zh: 昨天量了 `shelve`，卻沒問它底下是什麼。今天問了：這台機器上 shelve 選的是 `dbm.sqlite3`（3.13 之後的預設後備），不是我以為的 `dbm.dumb`。用同一份寫死的排程量兩個後端：**兩個都掉更新，只有 `dbm.dumb` 會壞索引**（41 個鍵剩 21 個）。真正的鎖買到的是**完整性**，對**遺失更新**一點幫助都沒有——因為遺失更新發生在兩個各自完全原子的操作**之間**。第二個發現：**會說出自己缺口的，是缺口比較大的那一個**。`dbm.dumb` 把「support concurrent access (currently, if two processes take turns making updates, they can mess up the index)」寫在 docstring 的 TO DO 清單裡；守住完整性的 `dbm.sqlite3` 一個字都沒說。這也補完了一個橫跨三天、同一個標準庫的刻度：**考古 010 把 `.pyc` 的模式寫進標頭 flag bits（任何東西都讀得到）→ 考古 011 把 `shelve` 的模式寫在 `open()` 呼叫裡（只有開檔的人看得到）→ 考古 012 把缺口寫在 docstring 的 TO DO 裡，而另一個乾脆不寫。** 重切把「保證」與「排程能揭露什麼」都變成具名單元，兩者都用跑的驗；`dbm.open()` 沒有任何辦法讓呼叫端問到這些。
  en: Yesterday measured shelve without ever asking what was underneath it. Today asked: on this machine shelve picks dbm.sqlite3, the post-3.13 fallback, not the dbm.dumb I assumed. Under one written-down schedule both backends lose an update and only dbm.dumb corrupts, losing 20 of 41 keys. Real locking buys index integrity and buys nothing at all on lost updates, because a lost update happens BETWEEN two operations that are each perfectly atomic. Second finding: the module that declares its gap is the one with the larger gap. dbm.dumb says "support concurrent access (currently, if two processes take turns making updates, they can mess up the index)" in a TO DO list inside its docstring; dbm.sqlite3, which holds integrity, says nothing about concurrency anywhere. This completes a scale across three consecutive entries in one standard library: archaeology 010 put the .pyc mode in header flag bits readable by anything, archaeology 011 put shelve's writeback mode in the open() call readable only by whoever opened the file, and archaeology 012 finds the gap in a docstring TO DO — with the safer backend not writing it down at all. The re-cut makes both the guarantees and what each schedule can reveal into named units whose declarations are checked by running them; dbm.open() gives a caller no way to ask any of it.
date: 2026-08-12
version: v1.0
verdict: locking-and-lost-updates-are-different-guarantees
concepts:
  - a-lost-update-happens-between-two-atomic-operations
  - the-module-that-declares-its-gap-has-the-smaller-one
  - a-schedule-is-a-unit-that-declares-what-it-can-reveal
  - where-a-mode-is-written-down-three-places-in-one-library
runnable: python src/main.py
