id: 006-eslint-plugin-import
project: eslint-plugin-import
upstream: https://github.com/import-js/eslint-plugin-import
license: MIT
examined_version: 2.32.0
title:
  zh: 46 條規則裡只有一個碰到兄弟，而那一個是改名——MSSP 兩個模組在這裡互相牴觸
  en: "One of 46 rules reaches a sibling, and it is a rename — where two MSSP modules contradict each other"
summary:
  zh: 46 個規則檔、79 次向上取用共用核心、108 次取用套件，而**引用兄弟規則的只有 1 次**：`imports-first.js` require `./first` 再覆寫 meta 標成 deprecated。那不是規則去拿兄弟的能力，是改名時把舊門留著。問題在於 MSSP 自己：模組 02 禁止 TMS 引用兄弟 TMS，模組 06 要求「替代先於移除」，而別名單元滿足其中一條的方式就是違反另一條。順帶量到這個專案存在的理由——本站宣告 25 個套件、裝了 475 個、可 require 但未宣告 450 個。
  en: 46 rule files, 79 requires reaching up to the shared core, 108 requires of packages — and exactly one require of a sibling rule: imports-first.js pulls in ./first and overrides its meta with deprecated:true. That is not a rule reaching a sibling for a capability, it is a rename that kept the old door open. The problem is MSSP's own: module 02 forbids a TMS importing a sibling TMS and module 06 requires replacement before removal, and an alias unit satisfies one by violating the other. Measured alongside it, the condition this project exists to answer: this site declares 25 packages, has 475 installed, and can require 450 it never declared.
date: 2026-08-06
version: v1.0
verdict: islands-confirmed-alias-is-not-a-dependency
concepts:
  - a-rename-is-not-a-sibling-dependency
  - two-method-modules-that-contradict-each-other
  - phantom-dependencies-are-the-default-not-the-exception
runnable: node src/main.js
