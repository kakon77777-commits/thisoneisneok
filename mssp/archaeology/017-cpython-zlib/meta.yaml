id: 017-cpython-zlib
project: CPython zlib
upstream: https://github.com/python/cpython/blob/main/Modules/zlibmodule.c
license: PSF-2.0
examined_version: measured at run time
title:
  zh: 半個串流跟一個完整串流，解出來是同一串位元組
  en: "Half a stream and a whole one decompress to the same bytes"
summary:
  zh: 同日的範例 017 主張**跑完了跟拿到全部了是兩件事**，而 `zlib` 把兩種答案放在同一個模組裡、而且兩種都是對的。同一份截斷輸入：`zlib.decompress` **拋例外**（Error -5, incomplete or truncated stream），`decompressobj().decompress` **不拋**，交回 218 bytes 並把 `eof` 設成 `False`。對照組是這一則能不能說話的關鍵——一個**完整**串流，payload 恰好是那 218 bytes：兩次解壓縮**位元組完全相同**，沒有任何回傳值分得開，唯一分得開的是 `.eof`。第二個發現更難修：**`.eof` 在 decompressor 物件上，bytes 是回傳值**，所以一個「解壓縮然後回傳 bytes」的函式在呼叫端看到東西之前就把判別器丟掉了——那正是範例 016「outcome 必須跟著紀錄走」在標準庫裡的樣子。第三、截斷切在紀錄中間：呼叫端 `split(b"\\n")` 拿到 19 筆完整加一個 `b'record-01'` 的碎片，而碎片以 `record-` 開頭、像極了一筆。第四、`max_length` 的**刻意**部分讀取跟**意外**截斷落在同一個狀態，`eof` 只說「還沒完」，不說為什麼。兩邊的行為都不適合改：串流解壓器不能對「還沒讀完」拋例外，那是它兩次呼叫之間的正常狀態；一次收完的函式把不完整當錯誤也是對的。缺陷在於**兩邊的結果沒有共同的形狀**，而那個旗標沒有跟著資料走。
  en: The same day's example 017 argues that finishing and being complete are two different things, and zlib puts both answers in one module with both of them correct. On the same truncated input, zlib.decompress raises (Error -5, incomplete or truncated stream) while decompressobj().decompress does not raise at all - it returns 218 bytes and sets eof to False. The control is what lets the entry claim anything: a COMPLETE stream whose payload is exactly those 218 bytes decompresses to byte-identical output, no returned value tells the two apart, and only .eof does. The second finding is harder to repair - .eof lives on the decompressor object while the bytes are the return value, so a function that decompresses and returns bytes has discarded the discriminator before its caller sees anything, which is example 016's "the outcome must travel with the records" appearing in the standard library. Third, the truncation cuts mid-record: the idiomatic split leaves nineteen whole records and a fragment reading record-01, well formed enough to be mistaken for one. Fourth, a deliberate partial read via max_length lands in the same state as an accidental truncation, so eof says not-finished without saying why. Neither behaviour should change - a streaming decompressor cannot raise on not-finished-yet, which is its normal state between calls, and a one-shot is right to treat incompleteness as an error. The defect is that the two results have no common shape and the flag does not travel with the data.
date: 2026-08-17
