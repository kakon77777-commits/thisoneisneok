id: 005-marked
project: marked
upstream: https://github.com/markedjs/marked
license: MIT
examined_version: 15.0.12
title:
  zh: marked 15.0.12：一個 use()，兩種相反的語意，由 key 的名字決定
  en: "marked 15.0.12: one use(), two opposite semantics, selected by a key name"
summary:
  zh: Lexer 4 個方法、Parser 2 個、Renderer 21 個（每個 token 型別一個）——走訪很小、處理很寬，而且 new Marked() 真的隔離。但 marked.use() 收到 walkTokens 或 hooks 會累積、收到 renderer 會覆寫，三種情況回傳同一個值，呼叫端無法分辨自己觸發了哪一種，也沒有 API 可以問現在裝了什麼。本週第三個回傳值在每條路徑上相同的設定函式。
  en: Lexer has four methods, Parser two, Renderer twenty-one — a small walk and a wide treatment — and new Marked() genuinely isolates. But marked.use() accumulates for walkTokens and hooks while overwriting for renderer, returns the same value in all three cases, and offers no way to ask what is installed. The third configuration function this week whose return value is identical on every path.
date: 2026-08-05
version: v1.0
verdict: pipeline-confirmed-two-rules-one-entry-point
concepts:
  - one-method-per-token-type
  - isolated-path-exists-but-is-not-the-default
  - two-semantics-behind-one-entry-point
  - configuration-that-returns-nothing-discriminating
runnable: node src/main.js
