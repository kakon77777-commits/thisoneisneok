license: PSF-2.0
examined_version: 3.14.5
title:
  zh: logging 3.14.5：四個軸切得很對，然後一層便利 API 一次跨過全部四個
  en: "logging 3.14.5: four axes cut correctly, and one convenience layer that reaches across all four"
summary:
  zh: 2,326 行，而 Logger／Handler／Formatter／Filter 是四個真正獨立的軸——Handler 持有 Formatter，Formatter 不認識 Handler，Filter 是單一方法協定，propagate 屬於 Logger 不屬於 Handler。這一則主要在說它為什麼對。漏處只有一個而且很精確：`logging.info()` 會在 root 沒有 handler 時偷偷呼叫 basicConfig，之後你自己的 basicConfig 就完全不做事、也不說。
  en: 2,326 lines, and Logger / Handler / Formatter / Filter are four genuinely independent axes — a Handler holds a Formatter, a Formatter knows no Handler, Filter is a one-method protocol, and propagate belongs to the Logger rather than the Handler. Most of this entry is why that works. The one leak is precise: logging.info() quietly calls basicConfig when the root has no handlers, after which your own basicConfig does nothing at all and says nothing about it.
date: 2026-08-03
version: v1.0
verdict: boundary-confirmed-one-leak
concepts:
  - dms-is-four-axes-not-one
  - convenience-layer-crosses-boundaries
  - silent-no-op-configuration
