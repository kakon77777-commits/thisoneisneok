id: 014-urlsearchparams
project: WHATWG URL Standard (URLSearchParams)
upstream: https://url.spec.whatwg.org/
license: MIT (Node implementation); CC-BY (the standard)
examined_version: measured at run time
title:
  zh: 兩個「單值」讀法，各留一端，都不說話
  en: "Two one-value reads of the same object, keeping opposite ends, neither of them saying so"
summary:
  zh: 範例 014 主張 arity 是契約條款而不是 accessor 隨手決定的事，所以來問：這個決定在真實世界是在哪裡做的？答案是每個 JavaScript web 應用的請求路徑上。一個鍵三個值（兩個同名 checkbox 就會這樣送）：**`get("tag")` 回 `"a"`、`Object.fromEntries(params).tag` 回 `"c"`**——同一個物件的兩個單值讀法，**留的那一端相反，而且都不說自己丟掉了兩個**。介面也沒有辦法問：`has()` 說有、`size` 數的是 pair 不是 key。第二個發現：`set` 與 `append` 在呼叫端長得一樣、arity 相同，而在已有兩個值的鍵上 `set` 留一個、`append` 留三個；而 `set`／`append`／`delete` 全部回傳 `undefined`，`get(missing)` 回 `null`——沒有任何一個操作的回傳值會因為它怎麼走而不同。WHATWG 沒做錯：query string 本來就允許重複，單值 accessor 非選不可，`get` 也誠實地叫 `get`；缺陷在呼叫端把它讀成在回答另一個問題。**我自己的檢查先錯了一次**：第一版把「all」的期望值寫死成 3，於是保留三個又加一個的 `append`（4）被標成不一致——錯的是檢查。改成從樣本量基線後五個都過，而故意把 `get` 標成 `all` 仍然會紅。
  en: Example 014 argues that arity is a contract term rather than something an accessor decides, so this asks where that decision actually gets made — in the request path of essentially every JavaScript web application. One key with three values, which is what a browser sends when two checkboxes share a name: get("tag") returns "a" and Object.fromEntries(params).tag returns "c". Two one-value reads of the same object, keeping opposite ends, and neither reports that two values were discarded. The interface offers no way to ask: has() says yes and size counts pairs rather than keys. Second finding: set and append look identical at the call site and have the same arity, yet on a key already holding two values set leaves one and append leaves three — and set, append and delete all return undefined while get for a missing key returns null, so no operation here answers differently depending on how it went. WHATWG is not wrong: a query string genuinely permits repetition, a one-value accessor must choose, and get is honestly named. The defect is callers reading it as answering a different question. My own check was wrong first: it hardcoded 3 as the expectation for "all", so append — which keeps all three and adds one, making 4 — was flagged as a mismatch. The check was wrong, not the accessor; with the baseline measured from the sample all five pass, and deliberately mislabelling get as "all" still goes red.
date: 2026-08-14
version: v1.0
verdict: two-one-value-reads-keeping-opposite-ends
