<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>∞ → Klein Bottle</title>
<style>
  :root {
    --bg: #060612;
    --panel: #0b0b20;
    --border: rgba(120,100,255,0.15);
    --text: #b8c4e8;
    --dim: rgba(184,196,232,0.45);
    --accent: #8866ff;
    --klein: #cc44ff;
    --torus: #22ddaa;
    --twist: #ffaa33;
    --red: #ff4455;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:var(--bg); overflow:hidden; }
  body { font-family:'SF Mono','Courier New',monospace; color:var(--text); }

  #app { display:flex; flex-direction:column; height:100vh; }

  #canvas-wrap {
    flex:1; position:relative; min-height:0;
    background: radial-gradient(ellipse at 40% 40%, #0e0a2a 0%, #060612 70%);
  }
  canvas { display:block; width:100%!important; height:100%!important; }

  /* Overlay top-left */
  #overlay {
    position:absolute; top:14px; left:14px;
    pointer-events:none; user-select:none;
  }
  #eml-id {
    font-size:9px; letter-spacing:2px; text-transform:uppercase;
    color:var(--dim); margin-bottom:10px;
  }
  #topo-badge {
    display:inline-flex; align-items:center; gap:6px;
    padding:5px 12px; border-radius:20px;
    font-size:13px; font-weight:700; letter-spacing:0.5px;
    border:1px solid currentColor;
    transition:all 0.5s cubic-bezier(.4,0,.2,1);
    background:rgba(6,6,18,0.8);
  }
  #topo-dot {
    width:7px; height:7px; border-radius:50%;
    background:currentColor;
    box-shadow:0 0 8px 2px currentColor;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:1; transform:scale(1); }
    50%      { opacity:0.6; transform:scale(0.7); }
  }

  /* Overlay bottom-left */
  #stats {
    position:absolute; bottom:14px; left:14px;
    pointer-events:none; user-select:none;
    display:flex; flex-direction:column; gap:4px;
  }
  .stat-row { display:flex; gap:8px; align-items:baseline; }
  .stat-k { font-size:9px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; width:24px; }
  .stat-v { font-size:15px; font-variant-numeric:tabular-nums; }

  /* H* badge */
  #hstar-badge {
    display:none;
    position:absolute; top:14px; right:14px;
    padding:5px 12px; border-radius:20px;
    font-size:12px; letter-spacing:1px;
    border:1px solid var(--klein);
    color:var(--klein); background:rgba(204,68,255,0.12);
    pointer-events:none;
    animation:glow 1.5s ease-in-out infinite;
  }
  @keyframes glow {
    0%,100% { box-shadow:0 0 6px var(--klein); }
    50%      { box-shadow:0 0 18px var(--klein), 0 0 40px rgba(204,68,255,0.4); }
  }

  /* Panel */
  #panel {
    flex-shrink:0;
    background:var(--panel);
    border-top:1px solid var(--border);
    padding:12px 14px 10px;
  }

  /* Slider row */
  .slider-section { margin-bottom:10px; }
  .slider-header {
    display:flex; justify-content:space-between; align-items:baseline;
    margin-bottom:6px;
  }
  .slider-label { font-size:10px; letter-spacing:2px; color:var(--dim); text-transform:uppercase; }
  .slider-vals { font-size:11px; color:var(--dim); }
  .slider-vals span { color:var(--text); font-size:13px; }

  .track-wrap { position:relative; padding-bottom:16px; }
  input[type=range] {
    width:100%; height:3px; appearance:none; outline:none;
    border-radius:2px; cursor:pointer;
    background: linear-gradient(
      to right,
      var(--torus) 0%,
      var(--accent) 50%,
      var(--klein) 100%
    );
  }
  input[type=range]::-webkit-slider-thumb {
    appearance:none; width:20px; height:20px;
    background:var(--accent); border-radius:50%;
    border:2px solid #fff; cursor:pointer;
    box-shadow:0 0 8px var(--accent);
    transition:box-shadow 0.2s;
  }
  input[type=range]:hover::-webkit-slider-thumb { box-shadow:0 0 14px var(--accent); }

  .hstar-line {
    position:absolute; bottom:0; width:1px; height:14px;
    background:var(--klein); opacity:0.7;
    pointer-events:none;
  }
  .hstar-text {
    position:absolute; bottom:0; font-size:9px;
    color:var(--klein); opacity:0.7;
    transform:translateX(-50%);
    white-space:nowrap; pointer-events:none;
  }

  /* Buttons */
  .btn-row { display:flex; gap:6px; }
  .btn {
    flex:1; padding:8px 2px; font-size:11px; font-weight:700;
    letter-spacing:1px; text-transform:uppercase;
    border:1px solid var(--border);
    background:rgba(255,255,255,0.03);
    color:var(--dim); border-radius:6px; cursor:pointer;
    font-family:inherit;
    transition:all 0.2s;
  }
  .btn:hover { background:rgba(136,102,255,0.15); color:var(--text); border-color:var(--accent); }
  .btn.on { background:rgba(136,102,255,0.2); color:var(--accent); border-color:var(--accent); }
  .btn.flow-on { background:rgba(34,221,170,0.15); color:var(--torus); border-color:var(--torus); }
</style>
</head>
<body>
<div id="app">
  <div id="canvas-wrap">
    <canvas id="c"></canvas>

    <div id="overlay">
      <div id="eml-id">EML-TOPOLOGY-INFINITY-2026</div>
      <div id="topo-badge" style="color:var(--twist)">
        <span id="topo-dot"></span>
        <span id="topo-text">扭轉環面</span>
      </div>
    </div>

    <div id="stats">
      <div class="stat-row">
        <span class="stat-k">H</span>
        <span class="stat-v" id="sv-h">0.150</span>
      </div>
      <div class="stat-row">
        <span class="stat-k">θ</span>
        <span class="stat-v" id="sv-holo">-72.1°</span>
      </div>
    </div>

    <div id="hstar-badge">H★ = 0.392</div>
  </div>

  <div id="panel">
    <div class="slider-section">
      <div class="slider-header">
        <span class="slider-label">Bridge Height</span>
        <span class="slider-vals">H = <span id="h-disp">0.150</span></span>
      </div>
      <div class="track-wrap">
        <input type="range" id="h-slider" min="0" max="0.6" step="0.002" value="0.15">
        <div class="hstar-line" id="hs-line"></div>
        <div class="hstar-text" id="hs-txt">H★</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn" id="btn-play">▶ FLOW</button>
      <button class="btn" id="btn-normals">NORMALS</button>
      <button class="btn" id="btn-wire">WIRE</button>
      <button class="btn" id="btn-reset">RESET</button>
    </div>
  </div>
</div>

<script src="/vendor/three/three.min.js"></script>
<script>
// ════════════════════════════════════════════════
//  MATH CORE
// ════════════════════════════════════════════════

const NP = 240, NT = 14, TR = 0.038, HSTAR = 0.392;

function makePath(H) {
  const pts = new Array(NP);
  for (let i = 0; i < NP; i++) {
    const t = i / NP * Math.PI * 2;
    const s = Math.sin(t), c = Math.cos(t), D = 1 + s*s;
    pts[i] = [c/D, s*c/D, H*s, t];
  }
  return pts;
}

function normalize3(v) {
  const l = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);
  return l < 1e-10 ? [1,0,0] : [v[0]/l,v[1]/l,v[2]/l];
}
function dot3(a,b) { return a[0]*b[0]+a[1]*b[1]+a[2]*b[2]; }
function cross3(a,b) {
  return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
}
function sub3(a,b) { return [a[0]-b[0],a[1]-b[1],a[2]-b[2]]; }
function scale3(v,s) { return [v[0]*s,v[1]*s,v[2]*s]; }

function makeTangents(pts) {
  return pts.map((_,i) => {
    const p = pts[(i-1+NP)%NP], q = pts[(i+1)%NP];
    return normalize3([(q[0]-p[0])*.5,(q[1]-p[1])*.5,(q[2]-p[2])*.5]);
  });
}

function makeBishop(tangs) {
  const T0 = tangs[0];
  const v = [0,0,1];
  const d = dot3(v,T0);
  let N1 = normalize3(sub3(v, scale3(T0,d)));
  const frames = [{T:T0, N1:[...N1]}];
  for (let i = 1; i < NP; i++) {
    const Tc = tangs[i];
    const dd = dot3(N1,Tc);
    N1 = normalize3(sub3(N1, scale3(Tc,dd)));
    frames.push({T:Tc, N1:[...N1]});
  }
  return frames;
}

function holonomy(frames) {
  const f0 = frames[0], fN = frames[NP-1];
  const N2i = cross3(f0.T, f0.N1);
  return Math.atan2(dot3(fN.N1,N2i), dot3(fN.N1,f0.N1)) * 180/Math.PI;
}

// Plasma colormap
function plasma(t) {
  t = Math.max(0,Math.min(1,t));
  const r = Math.min(1, 0.05 + t*0.9 + t*t*0.05);
  const g = Math.min(1, Math.max(0, -0.1 + t*0.8 - t*t*1.0));
  const b = Math.min(1, Math.max(0, 0.88 - t*1.6 + t*t*0.72));
  return [r,g,b];
}

// ════════════════════════════════════════════════
//  GEOMETRY BUILDERS
// ════════════════════════════════════════════════

function buildTubeGeo(pts, frames) {
  const pos=[], col=[], nor=[], idx=[];
  const th = Array.from({length:NT}, (_,j)=>j/NT*Math.PI*2);

  for (let i=0; i<NP; i++) {
    const [px,py,pz] = pts[i];
    const {T,N1} = frames[i];
    const BN = cross3(T,N1);
    const [r,g,b] = plasma(i/NP);
    for (let j=0; j<NT; j++) {
      const ct=Math.cos(th[j]), st=Math.sin(th[j]);
      const nx=ct*N1[0]+st*BN[0], ny=ct*N1[1]+st*BN[1], nz=ct*N1[2]+st*BN[2];
      pos.push(px+TR*nx, py+TR*ny, pz+TR*nz);
      nor.push(nx,ny,nz);
      col.push(r,g,b);
    }
  }

  for (let i=0; i<NP; i++) {
    for (let j=0; j<NT; j++) {
      const a=i*NT+j, b=i*NT+(j+1)%NT;
      const c=((i+1)%NP)*NT+j, d=((i+1)%NP)*NT+(j+1)%NT;
      idx.push(a,b,d, a,d,c);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  g.setIndex(idx);
  return g;
}

function buildSpineGeo(pts) {
  const pos=[], col=[];
  for (let i=0; i<=NP; i++) {
    const p=pts[i%NP];
    pos.push(p[0],p[1],p[2]);
    const [r,g,b]=plasma(i/NP); col.push(r,g,b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('color',    new THREE.Float32BufferAttribute(col,3));
  return g;
}

// ════════════════════════════════════════════════
//  THREE.JS SETUP
// ════════════════════════════════════════════════

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setClearColor(0x060612,1);
renderer.shadowMap.enabled = false;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x060612, 0.35);

const camera = new THREE.PerspectiveCamera(48,1,0.01,50);

// Lights
scene.add(new THREE.AmbientLight(0x2a2050, 2.5));
const dl1 = new THREE.DirectionalLight(0xffffff,1.2);
dl1.position.set(2,3,2); scene.add(dl1);
const dl2 = new THREE.DirectionalLight(0x4466ff,0.6);
dl2.position.set(-2,-2,-2); scene.add(dl2);
const pl = new THREE.PointLight(0xaa66ff,1.5,4);
pl.position.set(0,0,0); scene.add(pl);

// Materials
const tubeMat = new THREE.MeshPhongMaterial({
  vertexColors:true, transparent:true, opacity:0.72,
  side:THREE.DoubleSide, shininess:100,
  specular: new THREE.Color(0.2,0.2,0.5)
});
const spineMat = new THREE.LineBasicMaterial({vertexColors:true});

// Scene objects (mutable)
let tubeMesh=null, spineLine=null, normArrows=[], pts=null, frames=null;

// Crossing markers
const mkGeo = new THREE.SphereGeometry(0.07,10,10);
const mk1 = new THREE.Mesh(mkGeo, new THREE.MeshPhongMaterial({color:0xff3344,emissive:0x440011}));
const mk2 = new THREE.Mesh(mkGeo, new THREE.MeshPhongMaterial({color:0xff8833,emissive:0x441100}));
scene.add(mk1); scene.add(mk2);

// Labels for markers (using sprites via canvas)
function makeLabel(txt, col) {
  const cv = document.createElement('canvas');
  cv.width=128; cv.height=40;
  const ctx=cv.getContext('2d');
  ctx.font='bold 22px monospace';
  ctx.fillStyle=col;
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.fillText(txt, 64, 20);
  const tex = new THREE.CanvasTexture(cv);
  const mat = new THREE.SpriteMaterial({map:tex,transparent:true});
  const sp = new THREE.Sprite(mat);
  sp.scale.set(0.4,0.12,1);
  return sp;
}
const lb1 = makeLabel('⋈↑','#ff6677');
const lb2 = makeLabel('⋈↓','#ffaa55');
scene.add(lb1); scene.add(lb2);

// Flow sphere + arrow
const flowSph = new THREE.Mesh(
  new THREE.SphereGeometry(0.09,12,12),
  new THREE.MeshPhongMaterial({color:0x00ffaa,emissive:0x004422,shininess:120})
);
flowSph.visible = false; scene.add(flowSph);

const flowArr = new THREE.ArrowHelper(
  new THREE.Vector3(0,1,0), new THREE.Vector3(0,0,0),
  0.28, 0xff4455, 0.09, 0.045
);
flowArr.visible = false; scene.add(flowArr);

// ════════════════════════════════════════════════
//  SCENE UPDATE
// ════════════════════════════════════════════════

let showNormals=false, showWire=false, H=0.15;

function updateScene(h) {
  H = h;
  pts = makePath(h);
  const tangs = makeTangents(pts);
  frames = makeBishop(tangs);
  const holo = holonomy(frames);

  // Remove old
  if (tubeMesh) { scene.remove(tubeMesh); tubeMesh.geometry.dispose(); }
  if (spineLine) { scene.remove(spineLine); spineLine.geometry.dispose(); }
  normArrows.forEach(a=>scene.remove(a));
  normArrows = [];

  // Tube
  const tg = buildTubeGeo(pts,frames);
  tubeMesh = new THREE.Mesh(tg, tubeMat);
  tubeMat.wireframe = showWire;
  tubeMat.opacity = showWire ? 0.9 : 0.72;
  scene.add(tubeMesh);

  // Spine
  spineLine = new THREE.Line(buildSpineGeo(pts), spineMat);
  scene.add(spineLine);

  // Crossing markers
  const i1=Math.floor(NP/4), i2=Math.floor(3*NP/4);
  mk1.position.set(pts[i1][0],pts[i1][1],pts[i1][2]);
  mk2.position.set(pts[i2][0],pts[i2][1],pts[i2][2]);
  lb1.position.set(pts[i1][0],pts[i1][1]+0.18,pts[i1][2]);
  lb2.position.set(pts[i2][0],pts[i2][1]-0.18,pts[i2][2]);

  // Point light pulse based on |holo| proximity to -180
  const proximity = 1 - Math.min(1, Math.abs(Math.abs(holo)-180) / 90);
  pl.intensity = 1.5 + proximity*3;
  pl.color.setHex(Math.abs(holo) > 150 ? 0xcc44ff : 0x8866ff);

  // Normal arrows
  if (showNormals) {
    const count = 14;
    for (let k=0; k<count; k++) {
      const idx = Math.floor(k/count*NP);
      const p = pts[idx], f = frames[idx];
      const [r,g,b] = plasma(k/count);
      const dir = new THREE.Vector3(...f.N1);
      dir.normalize();
      const arr = new THREE.ArrowHelper(
        dir, new THREE.Vector3(p[0],p[1],p[2]),
        0.22, new THREE.Color(r,g,b).getHex(), 0.06,0.03
      );
      scene.add(arr); normArrows.push(arr);
    }
  }

  updateUI(h, holo);
}

function updateUI(h, holo) {
  const hf = h.toFixed(3);
  document.getElementById('h-disp').textContent = hf;
  document.getElementById('sv-h').textContent = hf;
  document.getElementById('sv-holo').textContent = holo.toFixed(1)+'°';

  const badge = document.getElementById('topo-badge');
  const dot = document.getElementById('topo-dot');
  const txt = document.getElementById('topo-text');
  const hstar = document.getElementById('hstar-badge');

  const absH = Math.abs(holo);
  const near180 = Math.abs(absH-180) < 6;

  if (absH < 8) {
    badge.style.color = 'var(--torus)';
    dot.style.background = 'var(--torus)';
    dot.style.boxShadow = '0 0 8px 2px var(--torus)';
    txt.textContent = '環面 (Torus)';
    hstar.style.display = 'none';
  } else if (near180) {
    badge.style.color = 'var(--klein)';
    dot.style.background = 'var(--klein)';
    dot.style.boxShadow = '0 0 8px 2px var(--klein)';
    txt.textContent = '★ 克萊茵瓶';
    hstar.style.display = 'block';
  } else {
    badge.style.color = 'var(--twist)';
    dot.style.background = 'var(--twist)';
    dot.style.boxShadow = '0 0 8px 2px var(--twist)';
    txt.textContent = '扭轉環面';
    hstar.style.display = 'none';
  }
}

// ════════════════════════════════════════════════
//  CAMERA ORBIT
// ════════════════════════════════════════════════

let theta=0.6, phi=1.15, camR=2.6;
let isDrag=false, lx=0, ly=0;
let autoRotate=true, lastTouch=Date.now();

function setCamera() {
  camera.position.set(
    camR*Math.sin(phi)*Math.sin(theta),
    camR*Math.cos(phi),
    camR*Math.sin(phi)*Math.cos(theta)
  );
  camera.lookAt(0,0,0);
}
setCamera();

const cv = renderer.domElement;

cv.addEventListener('mousedown', e=>{
  isDrag=true; lx=e.clientX; ly=e.clientY; lastTouch=Date.now();
});
window.addEventListener('mouseup', ()=>isDrag=false);
window.addEventListener('mousemove', e=>{
  if(!isDrag) return;
  theta -= (e.clientX-lx)*0.011;
  phi = Math.max(0.12,Math.min(Math.PI-0.12, phi-(e.clientY-ly)*0.011));
  lx=e.clientX; ly=e.clientY;
  setCamera();
});
cv.addEventListener('wheel', e=>{
  camR = Math.max(1.3,Math.min(7, camR+e.deltaY*0.004));
  setCamera(); e.preventDefault();
},{passive:false});

// Touch
let tPrev=null, pinchPrev=0;
cv.addEventListener('touchstart', e=>{
  lastTouch=Date.now();
  if(e.touches.length===1){
    tPrev=[e.touches[0].clientX, e.touches[0].clientY]; isDrag=true;
  } else if(e.touches.length===2){
    pinchPrev=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
  }
},{passive:true});
cv.addEventListener('touchend', ()=>{ tPrev=null; isDrag=false; },{passive:true});
cv.addEventListener('touchmove', e=>{
  lastTouch=Date.now();
  if(e.touches.length===1 && tPrev){
    theta -= (e.touches[0].clientX-tPrev[0])*0.011;
    phi = Math.max(0.12,Math.min(Math.PI-0.12, phi-(e.touches[0].clientY-tPrev[1])*0.011));
    tPrev=[e.touches[0].clientX,e.touches[0].clientY];
    setCamera(); e.preventDefault();
  } else if(e.touches.length===2){
    const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    camR=Math.max(1.3,Math.min(7, camR+(pinchPrev-d)*0.008));
    pinchPrev=d; setCamera();
  }
},{passive:false});

// ════════════════════════════════════════════════
//  CONTROLS
// ════════════════════════════════════════════════

// H* marker on slider
function posHStar() {
  const pct = (HSTAR/0.6)*100;
  document.getElementById('hs-line').style.left = pct+'%';
  document.getElementById('hs-txt').style.left  = pct+'%';
}
posHStar();

document.getElementById('h-slider').addEventListener('input', e=>{
  lastTouch=Date.now();
  updateScene(parseFloat(e.target.value));
});

let isPlaying=false, flowT=0;
document.getElementById('btn-play').addEventListener('click', e=>{
  isPlaying=!isPlaying;
  e.target.classList.toggle('flow-on', isPlaying);
  e.target.textContent = isPlaying ? '⏸ PAUSE' : '▶ FLOW';
  flowSph.visible = isPlaying;
  flowArr.visible = isPlaying;
});

document.getElementById('btn-normals').addEventListener('click', e=>{
  showNormals=!showNormals;
  e.target.classList.toggle('on', showNormals);
  updateScene(H);
});

document.getElementById('btn-wire').addEventListener('click', e=>{
  showWire=!showWire;
  e.target.classList.toggle('on', showWire);
  if(tubeMesh){
    tubeMat.wireframe=showWire;
    tubeMat.opacity=showWire?0.9:0.72;
  }
});

document.getElementById('btn-reset').addEventListener('click', ()=>{
  theta=0.6; phi=1.15; camR=2.6; setCamera();
});

// ════════════════════════════════════════════════
//  RESIZE
// ════════════════════════════════════════════════

function resize() {
  const w=document.getElementById('canvas-wrap').clientWidth;
  const h=document.getElementById('canvas-wrap').clientHeight;
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ════════════════════════════════════════════════
//  ANIMATION LOOP
// ════════════════════════════════════════════════

function animate() {
  requestAnimationFrame(animate);

  // Auto-rotate when idle
  if(autoRotate && !isDrag && Date.now()-lastTouch>2200){
    theta+=0.004; setCamera();
  }

  // Flow animation
  if(isPlaying && pts && frames){
    flowT=(flowT+0.0025)%1;
    const idx=Math.floor(flowT*NP);
    const p=pts[idx], f=frames[idx];
    flowSph.position.set(p[0],p[1],p[2]);
    flowArr.position.set(p[0],p[1],p[2]);
    const n1=new THREE.Vector3(f.N1[0],f.N1[1],f.N1[2]).normalize();
    flowArr.setDirection(n1);
  }

  renderer.render(scene,camera);
}

// ════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════

updateScene(0.15);
animate();
</script>
</body>
